replicaCount: 2

image:
  repository: ghcr.io/unishsys/spyglass
  # Empty defaults to the chart appVersion (pinned, immutable). Override to pin
  # a specific tag/digest. Avoid "latest" in production.
  tag: ""
  pullPolicy: IfNotPresent

# Image pull secrets for a private or mirrored registry (air-gapped / enterprise
# installs that re-host the image). References Secrets in the release namespace.
imagePullSecrets: []
#  - name: my-registry-cred

service:
  type: ClusterIP
  port: 8081
  # Annotations on the Service, e.g. an internal cloud load balancer:
  #   service.beta.kubernetes.io/azure-load-balancer-internal: "true"   (AKS)
  #   service.beta.kubernetes.io/aws-load-balancer-internal: "true"     (EKS)
  annotations: {}

# Authentication. Spyglass has full cluster read/write access, so the SECURE
# default is `token`: an auth token is auto-generated (and kept stable across
# upgrades) unless you supply one. Use `none` ONLY for throwaway/local clusters.
auth:
  mode: token # none | token | proxy-header
  token: "" # explicit bearer token; if empty in token mode, one is generated
  existingSecret: "" # Secret holding key AUTH_TOKEN (overrides .token)
  proxyHeader: X-Forwarded-User

# Offline license. Empty = Community tier (free, up to 10 nodes). Paste a signed
# license key here, or point at a Secret that holds a LICENSE_KEY key.
license:
  key: ""
  existingSecret: "" # Secret holding key LICENSE_KEY (overrides .key)

# Where the in-app "start a trial / upgrade" prompts link to.
upgradeUrl: https://spyglass.agrohi.com/pricing/

# AI SRE assistant. Provider-pluggable and runs IN-PROCESS in the dashboard (no
# separate service, no Spyglass-hosted endpoint). You bring the model and the
# key: the dashboard calls the provider directly from inside your cluster with
# credentials you supply. Every tool the agent has is READ-ONLY, it inspects
# the cluster and proposes fixes, it never applies changes.
#
# Providers:
#   ollama     local model on your own compute (Community + Enterprise)
#   anthropic  Claude via the Anthropic API with your key (Enterprise)
#   claude     Claude via Amazon Bedrock with your key (Enterprise; alias: bedrock)
#
# Cloud providers (anthropic, claude) are offered only when the dashboard is
# authenticated (auth.mode != none) AND an Enterprise license is present. With
# auth.mode=none or on Community, only local Ollama is offered, an anonymous
# caller can never spend your key. Most of this is also editable at runtime from
# the dashboard's Settings → AI page (requires auth.mode != none).
ai:
  # Which providers to build/offer, comma-separated, and the default when a chat
  # names none (empty defaultProvider = first in the list).
  providers: "ollama"
  defaultProvider: ""

  # Shared model behaviour for the Claude providers.
  effort: "high"        # low | medium | high | xhigh | max
  thinking: "adaptive"  # adaptive | off (off for models that reject the param)
  maxTokens: 8192        # max tokens per model reply
  maxToolIterations: 8   # model round-trips per run
  runTimeoutSeconds: 180 # hard wall-clock bound on one run (240 for slow local models)
  snapshotIntervalSeconds: 25

  # Ollama (local model). Point host at an in-cluster Ollama service. The default
  # model is the tuned, published Spyglass SRE model.
  ollama:
    host: "http://ollama.ollama.svc:11434"
    model: "sabbir/spyglass-sre"
    # Context window. Ollama's own default (4096) is too small for the SRE tools
    # and makes the model loop/derail; keep this at 16384+.
    numCtx: 16384
    maxTokens: 8192

  # Claude via the Anthropic API (direct, bring-your-own-key). Enterprise.
  # Provide the key inline (stored in the chart Secret) or via an existing Secret
  # with key ANTHROPIC_API_KEY.
  anthropic:
    apiKey: ""
    existingSecret: ""
    model: "claude-opus-5"   # or claude-sonnet-5 for lower cost
    baseUrl: ""              # optional gateway/proxy

  # Claude via Amazon Bedrock. Enterprise. Provide a Bedrock bearer token inline
  # or via an existing Secret with key AWS_BEARER_TOKEN_BEDROCK; leave both empty
  # to use the pod's AWS credential chain (IRSA / workload identity).
  bedrock:
    token: ""
    existingSecret: ""
    region: "us-east-1"
    model: "" # empty = backend default (anthropic.claude-opus-4-8)

  # Spend guardrails for CLOUD providers only (this is YOUR provider bill; Spyglass
  # never meters or bills tokens). Token budgets are enforced BEFORE a run starts,
  # with an in-flight reservation so concurrent chats can't collectively overspend.
  # 0 = unlimited.
  guardrails:
    dailyTokenBudget: 0
    monthlyTokenBudget: 0
    reserveTokens: 20000     # worst-case hold per in-flight cloud run
    rateLimitPerMinute: 20   # per principal, all providers; 0 disables
    maxConcurrentRuns: 4     # across the deployment; 0 disables
    # Optional: what your provider charges per million tokens, so the usage ledger
    # can show an ESTIMATED cost. Empty = built-in list prices for known Claude models.
    priceInPerMTok: ""
    priceOutPerMTok: ""

  # With auth.mode=none, cloud providers are disabled so an anonymous caller can't
  # spend your key. Set true ONLY on a trusted, isolated cluster to allow them anyway.
  allowCloudWithoutAuth: false

  # Persistence for the usage ledger + incident memory (embedded SQLite) and the
  # Settings-page overrides (including keys, written 0600). Without it these live
  # in memory and are lost on restart. STRONGLY recommended with cloud providers so
  # budgets and the ledger survive restarts.
  #
  # NOTE on replicas: the store is a per-pod SQLite file. With replicaCount > 1 and
  # a ReadWriteOnce volume, only one pod can mount it. For a single shared ledger and
  # budget, use a ReadWriteMany storage class, or run the dashboard with replicaCount: 1
  # when you rely on budgets. Otherwise each replica keeps its own ledger and enforces
  # budgets independently.
  persistence:
    enabled: false
    dataDir: /data/ai
    size: 1Gi
    storageClass: ""            # "" = cluster default
    accessMode: ReadWriteOnce   # ReadWriteMany for a shared ledger across replicas
    existingClaim: ""           # use a PVC you manage instead of creating one

# Optional anonymous usage ping. Set true to disable.
telemetryDisabled: false

# CORS. The SPA is same-origin (served by the same binary), so this is usually
# unnecessary. Set explicit comma-separated origins if you call the API
# cross-origin. Empty = not set (backend default).
cors:
  allowedOrigins: ""

# Ingress, controller-agnostic (uses ingressClassName + standard fields, no
# vendor annotations). Terminate TLS at the ingress or via tls.secretName.
ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# Extra environment variables passed to the container (list of {name,value}).
extraEnv: []

resources:
  requests:
    memory: "64Mi"
    cpu: "25m"
  limits:
    memory: "128Mi"
    cpu: "100m"

# --- RBAC / identity ---------------------------------------------------------
# The chart always creates the ServiceAccount the pod runs as. Set rbac.create
# to false to manage the (cluster-scoped) ClusterRole + ClusterRoleBinding
# yourself, e.g. when a security team owns RBAC (separation of duties).
rbac:
  create: true

serviceAccount:
  # Annotations on the ServiceAccount, used for cloud workload identity:
  #   azure.workload.identity/client-id: <client-id>        (AKS)
  #   eks.amazonaws.com/role-arn: arn:aws:iam::...:role/... (EKS / IRSA)
  #   iam.gke.io/gcp-service-account: <gsa>@<project>...    (GKE)
  annotations: {}

# --- Labels / annotations applied to all chart-managed objects ---------------
# Handy for cost allocation, ownership, or satisfying admission policies
# (OPA Gatekeeper / Kyverno) that require specific labels/annotations.
commonLabels: {}
commonAnnotations: {}

# Pod-only metadata. podAnnotations is where service-mesh sidecar injection and
# Prometheus scrape hints go (e.g. linkerd.io/inject: enabled,
# prometheus.io/scrape: "true").
podAnnotations: {}
podLabels: {}

# --- Security context --------------------------------------------------------
# Restricted-by-default (passes the Pod Security "restricted" profile). On
# OpenShift, drop the fixed UIDs so the SCC can assign them, set
# podSecurityContext to {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# --- Scheduling --------------------------------------------------------------
# Pin/avoid nodes. The most common need: tolerate a tainted node pool so the
# pod can schedule at all (e.g. an AKS spot pool), and spread replicas for HA.
nodeSelector: {}

tolerations: []
#  - key: kubernetes.azure.com/scalesetpriority   # AKS spot pool
#    operator: Equal
#    value: spot
#    effect: NoSchedule

affinity: {}

# Spread the replicas across zones/nodes for availability.
topologySpreadConstraints: []
#  - maxSkew: 1
#    topologyKey: topology.kubernetes.io/zone
#    whenUnsatisfiable: ScheduleAnyway
#    labelSelector:
#      matchLabels:
#        app: spyglass

# Protect the dashboard from preemption/eviction under pressure, useful on
# spot/preemptible pools. e.g. "system-cluster-critical" or your own class.
priorityClassName: ""

# --- Lifecycle / rollout -----------------------------------------------------
terminationGracePeriodSeconds: 30
revisionHistoryLimit: 3
# Deployment update strategy. Default Helm/K8s rolling update; override to e.g.
# {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}} for
# zero-downtime upgrades.
strategy: {}

# --- Probes (HTTP GET /ping) -------------------------------------------------
# Only the timing fields, the path/port are fixed. Loosen these on slow
# clusters, or add a startupProbe for slow first starts.
livenessProbe:
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
# Opt-in. e.g. {failureThreshold: 30, periodSeconds: 5} gives ~150s to start.
startupProbe: {}

# --- Extra volumes -----------------------------------------------------------
# Mount additional volumes, e.g. a corporate/self-signed CA bundle the app
# should trust. Mount read-only; the root filesystem is read-only.
extraVolumes: []
#  - name: ca-bundle
#    configMap:
#      name: my-ca-bundle
extraVolumeMounts: []
#  - name: ca-bundle
#    mountPath: /etc/ssl/certs/extra-ca.crt
#    subPath: ca.crt
#    readOnly: true

# --- High availability -------------------------------------------------------
# A PodDisruptionBudget keeps the dashboard up during voluntary disruptions
# (node drains, upgrades, spot reclamation). Set only one of minAvailable /
# maxUnavailable. Needs replicaCount > 1 to be meaningful.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

# --- Network policy ----------------------------------------------------------
# Restrict who can reach the dashboard port. Egress is left open (the app must
# reach the API server, metrics, and optionally Ollama). allowedNamespaces is a
# list of namespace names allowed to connect; empty = allow from anywhere.
#
# CAVEAT: when allowedNamespaces is set, the rule restricts the dashboard port to
# those namespaces. kubelet liveness/readiness probes come from the node (not a
# namespace), and some CNIs (e.g. Calico) will then block them, causing a
# restart loop. If you set allowedNamespaces, confirm your CNI still permits
# node→pod health probes, or also allow the node/pod CIDR.
networkPolicy:
  enabled: false
  allowedNamespaces: []
#    - ingress-nginx

{{- /*
PersistentVolumeClaim for the AI usage ledger + incident memory (embedded SQLite)
and the Settings-page overrides. Created only when ai.persistence is enabled and
no existingClaim is supplied. See values.yaml for the multi-replica caveat.
*/}}
{{- $aiPersist := (.Values.ai | default dict).persistence | default dict -}}
{{- if and $aiPersist.enabled (not $aiPersist.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "spyglass.aiPvcName" . }}
  labels:
    {{- include "spyglass.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ $aiPersist.accessMode | default "ReadWriteOnce" | quote }}
  resources:
    requests:
      storage: {{ $aiPersist.size | default "1Gi" | quote }}
  {{- if $aiPersist.storageClass }}
  storageClassName: {{ $aiPersist.storageClass | quote }}
  {{- end }}
{{- end }}

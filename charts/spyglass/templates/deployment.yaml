---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spyglass
  labels:
    {{- include "spyglass.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "spyglass.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "spyglass.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pods when the auth token / license Secret changes (env from
        # secretKeyRef isn't hot-reloaded otherwise).
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: spyglass
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: spyglass
        image: "{{ include "spyglass.image" . }}"
        command: ["/mapper"]
        args: ["incluster"]
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: PORT
          value: {{ .Values.service.port | quote }}
        - name: AUTH_MODE
          value: {{ .Values.auth.mode | quote }}
        {{- if eq .Values.auth.mode "proxy-header" }}
        - name: AUTH_PROXY_HEADER
          value: {{ .Values.auth.proxyHeader | quote }}
        {{- end }}
        {{- if eq .Values.auth.mode "token" }}
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.auth.existingSecret | default (include "spyglass.secretName" .) }}
              key: AUTH_TOKEN
        {{- end }}
        {{- if or .Values.license.key .Values.license.existingSecret }}
        - name: LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.license.existingSecret | default (include "spyglass.secretName" .) }}
              key: LICENSE_KEY
        {{- end }}
        - name: UPGRADE_URL
          value: {{ .Values.upgradeUrl | quote }}
        # --- AI SRE assistant (bring-your-own-key; all tools read-only) ---
        - name: AI_PROVIDERS
          value: {{ .Values.ai.providers | quote }}
        {{- if .Values.ai.defaultProvider }}
        - name: AI_PROVIDER
          value: {{ .Values.ai.defaultProvider | quote }}
        {{- end }}
        - name: EFFORT
          value: {{ .Values.ai.effort | quote }}
        - name: AI_THINKING
          value: {{ .Values.ai.thinking | quote }}
        - name: MAX_TOKENS
          value: {{ .Values.ai.maxTokens | quote }}
        - name: AI_MAX_TOOL_ITERATIONS
          value: {{ .Values.ai.maxToolIterations | quote }}
        - name: AI_RUN_TIMEOUT_SECONDS
          value: {{ .Values.ai.runTimeoutSeconds | quote }}
        - name: AI_SNAPSHOT_INTERVAL_SECONDS
          value: {{ .Values.ai.snapshotIntervalSeconds | quote }}
        # Ollama (local, unmetered)
        - name: OLLAMA_HOST
          value: {{ .Values.ai.ollama.host | quote }}
        - name: OLLAMA_MODEL
          value: {{ .Values.ai.ollama.model | quote }}
        - name: OLLAMA_NUM_CTX
          value: {{ .Values.ai.ollama.numCtx | quote }}
        - name: OLLAMA_MAX_TOKENS
          value: {{ .Values.ai.ollama.maxTokens | quote }}
        # Claude via the Anthropic API (Enterprise)
        {{- if .Values.ai.anthropic.model }}
        - name: ANTHROPIC_MODEL
          value: {{ .Values.ai.anthropic.model | quote }}
        {{- end }}
        {{- if .Values.ai.anthropic.baseUrl }}
        - name: ANTHROPIC_BASE_URL
          value: {{ .Values.ai.anthropic.baseUrl | quote }}
        {{- end }}
        {{- if or .Values.ai.anthropic.apiKey .Values.ai.anthropic.existingSecret }}
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.ai.anthropic.existingSecret | default (include "spyglass.secretName" .) }}
              key: ANTHROPIC_API_KEY
        {{- end }}
        # Claude via Amazon Bedrock (Enterprise)
        {{- if .Values.ai.bedrock.region }}
        - name: AWS_REGION
          value: {{ .Values.ai.bedrock.region | quote }}
        {{- end }}
        {{- if .Values.ai.bedrock.model }}
        - name: MODEL
          value: {{ .Values.ai.bedrock.model | quote }}
        {{- end }}
        {{- if or .Values.ai.bedrock.token .Values.ai.bedrock.existingSecret }}
        - name: AWS_BEARER_TOKEN_BEDROCK
          valueFrom:
            secretKeyRef:
              name: {{ .Values.ai.bedrock.existingSecret | default (include "spyglass.secretName" .) }}
              key: AWS_BEARER_TOKEN_BEDROCK
        {{- end }}
        # Spend guardrails (cloud providers only)
        - name: AI_BUDGET_DAILY_TOKENS
          value: {{ .Values.ai.guardrails.dailyTokenBudget | quote }}
        - name: AI_BUDGET_MONTHLY_TOKENS
          value: {{ .Values.ai.guardrails.monthlyTokenBudget | quote }}
        - name: AI_RESERVE_TOKENS
          value: {{ .Values.ai.guardrails.reserveTokens | quote }}
        - name: AI_RATE_LIMIT_PER_MINUTE
          value: {{ .Values.ai.guardrails.rateLimitPerMinute | quote }}
        - name: AI_MAX_CONCURRENT_RUNS
          value: {{ .Values.ai.guardrails.maxConcurrentRuns | quote }}
        {{- if .Values.ai.guardrails.priceInPerMTok }}
        - name: AI_PRICE_IN_PER_MTOK
          value: {{ .Values.ai.guardrails.priceInPerMTok | quote }}
        {{- end }}
        {{- if .Values.ai.guardrails.priceOutPerMTok }}
        - name: AI_PRICE_OUT_PER_MTOK
          value: {{ .Values.ai.guardrails.priceOutPerMTok | quote }}
        {{- end }}
        {{- if .Values.ai.allowCloudWithoutAuth }}
        - name: AI_ALLOW_CLOUD_WITHOUT_AUTH
          value: "true"
        {{- end }}
        # Persistence (usage ledger + incident memory + settings)
        {{- if .Values.ai.persistence.enabled }}
        - name: AI_DATA_DIR
          value: {{ .Values.ai.persistence.dataDir | quote }}
        {{- end }}
        {{- if .Values.telemetryDisabled }}
        - name: TELEMETRY_DISABLED
          value: "true"
        {{- end }}
        {{- if .Values.cors.allowedOrigins }}
        - name: CORS_ALLOWED_ORIGINS
          value: {{ .Values.cors.allowedOrigins | quote }}
        {{- end }}
        {{- with .Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        {{- with .Values.startupProbe }}
        startupProbe:
          httpGet:
            path: /ping
            port: {{ $.Values.service.port }}
          {{- toYaml . | nindent 10 }}
        {{- end }}
        readinessProbe:
          httpGet:
            path: /ping
            port: {{ .Values.service.port }}
          {{- with .Values.readinessProbe }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        livenessProbe:
          httpGet:
            path: /ping
            port: {{ .Values.service.port }}
          {{- with .Values.livenessProbe }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- if or .Values.ai.persistence.enabled .Values.extraVolumeMounts }}
        volumeMounts:
        {{- if .Values.ai.persistence.enabled }}
        - name: ai-data
          mountPath: {{ .Values.ai.persistence.dataDir | quote }}
        {{- end }}
        {{- with .Values.extraVolumeMounts }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- if or .Values.ai.persistence.enabled .Values.extraVolumes }}
      volumes:
      {{- if .Values.ai.persistence.enabled }}
      - name: ai-data
        persistentVolumeClaim:
          claimName: {{ include "spyglass.aiPvcName" . }}
      {{- end }}
      {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}

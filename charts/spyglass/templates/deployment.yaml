{{- if and .Values.ai.persistence.enabled (not (has .Values.ai.persistence.accessMode (list "ReadWriteOnce" "ReadWriteOncePod"))) }}{{ fail "AI SQLite storage requires a local RWO/RWOP block volume; shared RWX is unsupported" }}{{ end -}}
{{- if ne .Values.strategy.type "Recreate" }}{{ fail "strategy.type must be Recreate to avoid overlapping SQLite writers" }}{{ end -}}
{{- if ne (int .Values.replicaCount) 1 }}{{ fail "Spyglass requires replicaCount=1: SQLite and WebSocket tickets are process-local" }}{{ end -}}
{{- if not (has .Values.auth.mode (list "token" "proxy-header")) }}{{ fail "in-cluster authentication must be token or proxy-header" }}{{ end -}}
{{- if and (eq .Values.auth.mode "proxy-header") (empty .Values.auth.proxyTrustedCIDRs) }}{{ fail "proxy-header requires auth.proxyTrustedCIDRs" }}{{ end -}}
{{- $ai := .Values.ai | default dict -}}
{{- $aiOllama := $ai.ollama | default dict -}}
{{- $aiAnthropic := $ai.anthropic | default dict -}}
{{- $aiBedrock := $ai.bedrock | default dict -}}
{{- $aiGuard := $ai.guardrails | default dict -}}
{{- $aiPersist := $ai.persistence | default dict -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spyglass
  labels:
    {{- include "spyglass.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "spyglass.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "spyglass.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pods when the auth token / license Secret changes (env from
        # secretKeyRef isn't hot-reloaded otherwise).
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: spyglass
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: spyglass
        image: "{{ include "spyglass.image" . }}"
        command: ["/mapper"]
        args: ["incluster"]
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: PORT
          value: {{ .Values.service.port | quote }}
        - name: AUTH_MODE
          value: {{ .Values.auth.mode | quote }}
        {{- if eq .Values.auth.mode "proxy-header" }}
        - name: AUTH_PROXY_TRUSTED_CIDRS
          value: {{ join "," .Values.auth.proxyTrustedCIDRs | quote }}
        - name: AUTH_PROXY_HEADER
          value: {{ .Values.auth.proxyHeader | quote }}
        {{- end }}
        {{- if eq .Values.auth.mode "token" }}
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.auth.existingSecret | default (include "spyglass.secretName" .) }}
              key: AUTH_TOKEN
        {{- end }}
        {{- if or .Values.license.key .Values.license.existingSecret }}
        - name: LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.license.existingSecret | default (include "spyglass.secretName" .) }}
              key: LICENSE_KEY
        {{- end }}
        - name: UPGRADE_URL
          value: {{ .Values.upgradeUrl | quote }}
        # --- AI SRE assistant (bring-your-own-key; all tools read-only) ---
        # Nil-safe locals (default dict) keep this rendering across value-schema changes, so
        # `helm upgrade --reuse-values` from a release predating ai.* still renders.
        - name: AI_PROVIDERS
          value: {{ $ai.providers | default "ollama" | quote }}
        {{- if $ai.defaultProvider }}
        - name: AI_PROVIDER
          value: {{ $ai.defaultProvider | quote }}
        {{- end }}
        - name: EFFORT
          value: {{ $ai.effort | default "high" | quote }}
        - name: AI_THINKING
          value: {{ $ai.thinking | default "adaptive" | quote }}
        - name: MAX_TOKENS
          value: {{ $ai.maxTokens | default 8192 | int64 | quote }}
        - name: AI_MAX_TOOL_ITERATIONS
          value: {{ $ai.maxToolIterations | default 8 | int64 | quote }}
        - name: AI_RUN_TIMEOUT_SECONDS
          value: {{ $ai.runTimeoutSeconds | default 180 | int64 | quote }}
        - name: AI_SNAPSHOT_INTERVAL_SECONDS
          value: {{ $ai.snapshotIntervalSeconds | default 25 | int64 | quote }}
        # Ollama (local, unmetered)
        - name: OLLAMA_HOST
          value: {{ $aiOllama.host | default "http://ollama.ollama.svc:11434" | quote }}
        - name: OLLAMA_MODEL
          value: {{ $aiOllama.model | default "sabbir/spyglass-sre" | quote }}
        - name: OLLAMA_NUM_CTX
          value: {{ $aiOllama.numCtx | default 16384 | int64 | quote }}
        - name: OLLAMA_MAX_TOKENS
          value: {{ $aiOllama.maxTokens | default 8192 | int64 | quote }}
        # Claude via the Anthropic API (Enterprise)
        {{- if $aiAnthropic.model }}
        - name: ANTHROPIC_MODEL
          value: {{ $aiAnthropic.model | quote }}
        {{- end }}
        {{- if $aiAnthropic.baseUrl }}
        - name: ANTHROPIC_BASE_URL
          value: {{ $aiAnthropic.baseUrl | quote }}
        {{- end }}
        {{- if or ($aiAnthropic.apiKey) ($aiAnthropic.existingSecret) }}
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ $aiAnthropic.existingSecret | default (include "spyglass.secretName" .) }}
              key: ANTHROPIC_API_KEY
        {{- end }}
        # Claude via Amazon Bedrock (Enterprise)
        {{- if $aiBedrock.region }}
        - name: AWS_REGION
          value: {{ $aiBedrock.region | quote }}
        {{- end }}
        {{- if $aiBedrock.model }}
        - name: MODEL
          value: {{ $aiBedrock.model | quote }}
        {{- end }}
        {{- if or ($aiBedrock.token) ($aiBedrock.existingSecret) }}
        - name: AWS_BEARER_TOKEN_BEDROCK
          valueFrom:
            secretKeyRef:
              name: {{ $aiBedrock.existingSecret | default (include "spyglass.secretName" .) }}
              key: AWS_BEARER_TOKEN_BEDROCK
        {{- end }}
        # Spend guardrails (cloud providers only)
        - name: AI_BUDGET_DAILY_TOKENS
          value: {{ $aiGuard.dailyTokenBudget | default 0 | int64 | quote }}
        - name: AI_BUDGET_MONTHLY_TOKENS
          value: {{ $aiGuard.monthlyTokenBudget | default 0 | int64 | quote }}
        - name: AI_RESERVE_TOKENS
          value: {{ $aiGuard.reserveTokens | default 0 | int64 | quote }}
        - name: AI_RATE_LIMIT_PER_MINUTE
          value: {{ $aiGuard.rateLimitPerMinute | default 0 | int64 | quote }}
        - name: AI_MAX_CONCURRENT_RUNS
          value: {{ $aiGuard.maxConcurrentRuns | default 0 | int64 | quote }}
        {{- if $aiGuard.priceInPerMTok }}
        - name: AI_PRICE_IN_PER_MTOK
          value: {{ $aiGuard.priceInPerMTok | quote }}
        {{- end }}
        {{- if $aiGuard.priceOutPerMTok }}
        - name: AI_PRICE_OUT_PER_MTOK
          value: {{ $aiGuard.priceOutPerMTok | quote }}
        {{- end }}
        {{- if $ai.allowRawDiagnostics }}
        - name: AI_ALLOW_RAW_DIAGNOSTICS
          value: "true"
        {{- end }}
        # Persistence (usage ledger + incident memory + settings)
        {{- if $aiPersist.enabled }}
        - name: AI_DATA_DIR
          value: {{ $aiPersist.dataDir | default "/data/ai" | quote }}
        {{- end }}
        {{- if .Values.telemetryDisabled }}
        - name: TELEMETRY_DISABLED
          value: "true"
        {{- end }}
        {{- if .Values.cors.allowedOrigins }}
        - name: CORS_ALLOWED_ORIGINS
          value: {{ .Values.cors.allowedOrigins | quote }}
        {{- end }}
        {{- with .Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        {{- with .Values.startupProbe }}
        startupProbe:
          httpGet:
            path: /ping
            port: {{ $.Values.service.port }}
          {{- toYaml . | nindent 10 }}
        {{- end }}
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ .Values.service.port }}
          {{- with .Values.readinessProbe }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        livenessProbe:
          httpGet:
            path: /ping
            port: {{ .Values.service.port }}
          {{- with .Values.livenessProbe }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- if or ($aiPersist.enabled) .Values.extraVolumeMounts }}
        volumeMounts:
        {{- if $aiPersist.enabled }}
        - name: ai-data
          mountPath: {{ $aiPersist.dataDir | default "/data/ai" | quote }}
        {{- end }}
        {{- with .Values.extraVolumeMounts }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- if or ($aiPersist.enabled) .Values.extraVolumes }}
      volumes:
      {{- if $aiPersist.enabled }}
      - name: ai-data
        persistentVolumeClaim:
          claimName: {{ include "spyglass.aiPvcName" . }}
      {{- end }}
      {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
